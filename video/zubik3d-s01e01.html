<script type="module">
import * as THREE from './lib/three.module.min.js';
const W = 1080, H = 1920, DURATION = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px Nunito, "DejaVu Sans", sans-serif`;
// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
// scene visibility: fade in over 0.4s at a, fade out over 0.4s at b
const vis = (t, a, b, f = .4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function star4(x, y, r, rot = 0) {

  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rr = i % 2 ? r * .28 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);

}
function star5(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }

}
function heart(x, y, s) {

// ---------- text ----------
function caption(lines, x, y, size, k, opts = {}) {

  ctx.save();
  const sc = easeBack(clamp(k));

  ctx.font = F(weight, size);

}

function bubble(lines, x, y, size, k, tx, ty, o = {}) {

// ===== 3D scene: «Зубик против Кариеса», Серия 1 =====
const R3 = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const SPH = new THREE.SphereGeometry(1, 48, 32), SPHlo = new THREE.SphereGeometry(1, 20, 14);
const MT = {

  const cv = document.createElement('canvas'); cv.width = cv.height = 256; const x = cv.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, 256, 256); x.fillStyle = c2; const w = 256 / n;
  for (let i = -n; i < n * 2; i++) { x.beginPath(); x.moveTo(i * w, 0); x.lineTo(i * w + w / 2, 0); x.lineTo(i * w + w / 2 + 128, 256); x.lineTo(i * w + 128, 256); x.fill(); }

  mesh(new THREE.CircleGeometry(.15, 20, Math.PI, Math.PI), MT.tongueS, V(0, -.3, .86), V(1, .8, 1), smile);
  const pts = []; for (let i = 0; i <= 8; i++) pts.push(V(-.28 + i * .07, -.22 + (i % 2 ? .05 : 0), .845));
  const frown = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, .028, 6), MT.black, null, null, face);
  const brows = new THREE.Group(); face.add(brows);
  for (const s of [-1, 1]) { const b = mesh(new THREE.CapsuleGeometry(.035, .2, 4, 8), MT.black, V(s * .36, .62, .66), null, brows); b.rotation.z = Math.PI / 2 - s * .35; }

    const z = .85 * Math.sqrt(Math.max(.05, 1 - x * x - (y / 1.15) ** 2)) + .01;

    const n = V(x, y / 1.32, z / .72).normalize(); m.quaternion.setFromUnitVectors(V(0, 0, 1), n);

    mesh(capG, MT.arm, V(0, -.45, 0), null, aL); mesh(SPHlo, MT.arm, V(0, -.9, 0), V(.17, .17, .17), aL);
    armR = new THREE.Group(); armR.position.set(.95, -.1, .1); armR.rotation.z = .6; body.add(armR);
    mesh(capG, MT.arm, V(0, -.45, 0), null, armR); mesh(SPHlo, MT.arm, V(0, -.9, 0), V(.17, .17, .17), armR);
  }

    const blink = ((t + rand(seed) * 3) % 3.3) < .12;
    const shut = sleep > .5 || blink;
    open.visible = !shut; closed.visible = shut;
    const happy = mood >= .5, awake = sleep <= .5;
    smile.visible = awake && happy; frown.visible = awake && !happy; brows.visible = awake && !happy; oM.visible = !awake;
    pupils.forEach((p, i) => { const k = happy ? 1 : .62; p.scale.set(k, k, 1); p.position.x = (i ? 1 : -1) * .34 + (happy ? 0 : Math.sin(t * 40 + i) * .015); });

// ---------- germ ----------
function makeGerm(color, seed) {
  const g = new THREE.Group(), b = new THREE.Group(); g.add(b);
  const geo = new THREE.SphereGeometry(1, 48, 32), pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const v = V(pa.getX(i), pa.getY(i), pa.getZ(i));
    v.multiplyScalar(1 + .07 * Math.sin(v.x * 5 + seed) * Math.sin(v.y * 5) * Math.sin(v.z * 5 + seed * 2));
    pa.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mat = phys(color, { roughness: .5, clearcoat: .4 });
  mesh(geo, mat, null, null, b);
  for (let i = 0; i < 16; i++) {
    const phi = Math.acos(1 - 2 * (i + .5) / 16), th = i * 2.4 + seed;
    const d = V(Math.sin(phi) * Math.cos(th), Math.cos(phi), Math.sin(phi) * Math.sin(th));
    if (d.z > .6) continue;
    mesh(SPHlo, mat, d.multiplyScalar(1.02), V(.22, .22, .22), b);
  }
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * .33, .18, .86); b.add(e); eyes.push(e);
    mesh(SPHlo, MT.white, V(0, 0, 0), V(.24, .26, .15), e);
    mesh(SPHlo, MT.black, V(-s * .03, -.03, .11), V(.11, .12, .05), e);
    const brow = mesh(new THREE.BoxGeometry(.4, .09, .09), MT.black, V(s * .33, .52, .84), null, b); brow.rotation.z = s * .45;
  }
  const mo = mesh(new THREE.CircleGeometry(.36, 24, Math.PI, Math.PI), std(0x3a1020), V(0, -.2, .9), null, b); mo.rotation.x = .4;
  for (const x of [-.15, .12]) { const tt = mesh(new THREE.ConeGeometry(.06, .15, 4), MT.white, V(x, -.25, .92), null, b); tt.rotation.z = Math.PI; tt.rotation.x = .4; }
  return { g, b, eyes, mat };
}
function makeCaries() {
  const c = makeGerm(0x6a3fb0, 7);
  const hatTex = stripeTex('#ff4f8b', '#ffe14d', 6);
  const hatMat = phys(0xffffff, { map: hatTex, roughness: .3, clearcoat: 1 });
  const hat = new THREE.Group(); hat.position.set(0, .95, 0); hat.rotation.z = .15; c.b.add(hat);

  for (const s of [-1, 1]) { const w = mesh(new THREE.ConeGeometry(.22, .5, 12), hatMat, V(s * 1.25, .05, -.3), null, hat); w.rotation.z = s * Math.PI / 2; }

  const cane = new THREE.Group(); cane.position.set(1.25, -.1, .3); c.g.add(cane);
  mesh(new THREE.TubeGeometry(curve, 60, .11, 12), phys(0xffffff, { map: caneTex, clearcoat: 1, roughness: .2 }), null, null, cane);

}

// ---------- mouth scene ----------
const mouth = new THREE.Scene();
const caveMat = std(0x2a0c24, { side: THREE.BackSide, roughness: .9 });
mesh(new THREE.SphereGeometry(40, 48, 32), caveMat, V(0, 5, -5), null, mouth).castShadow = false;
const RAD = 9, ANG = .27;

mesh(SPH, tongueMat, V(0, -2.7, 4.6), V(6.5, 1.7, 4.2), mouth);

mesh(new THREE.TorusGeometry(4.6, 1.3, 24, 64), lipMat, OPEN, V(1, .62, 1), mouth);
function skyTex(day) {

{
  const pink = phys(0xff6fa5, { clearcoat: 1, roughness: .2 });

  [88, 91, 96, 100].forEach((n, i) => tone(23.0 + i * .08, note(n), .6, { gain: .07 }));
  // candy scene
  noise(26.3, .6, { gain: .15, type: 'bandpass', f0: 200, f1: 600, q: 4 }); // lid creak
  tone(27.6, 1568, 1.2, { gain: .25 }); tone(27.6, 2350, .9, { gain: .1 }); // ding (wink)
  tone(28.25, 98, 1.6, { type: 'sawtooth', gain: .12, f1: 92 }); tone(28.25, 147, 1.6, { type: 'sawtooth', gain: .08 }); // sting
  // ---- background score ----
  const pl = (x, n, d = .35, g = .14, type = 'triangle') => tone(x, note(n), d, { type, gain: g });
  // 0–5 mystery: slow A-minor arpeggio
  [57, 60, 64, 69, 64, 60, 57, 60, 64, 71].forEach((n, i) => pl(.6 + i * .45, n, 1.1, .12, 'sine'));
  // 5–9 sneaky villain theme (tiptoe pizzicato)
  const sneak = [45, 0, 48, 0, 50, 51, 52, 0, 45, 0, 48, 0, 52, 51, 50, 0];
  sneak.forEach((n, i) => { if (n) pl(5 + i * .25, n, .22, .22, 'square'); });
  [69, 72, 75, 76].forEach((n, i) => pl(6 + i * .5, n, .2, .06));
  // 9–13 tense ostinato
  for (let i = 0; i < 16; i++) pl(9.2 + i * .24, [57, 58][i % 2], .2, .12, 'sawtooth');
  for (let i = 0; i < 4; i++) tone(9.2 + i * .96, note(33), .9, { type: 'sawtooth', gain: .1 });
  // 13–18 chase bass under drums
  const chase = [45, 45, 48, 45, 50, 45, 51, 52];
  for (let i = 0; i < 14; i++) pl(13.1 + i * .35, chase[i % 8], .3, .2, 'square');
  [69, 72, 76, 72].forEach((n, i) => { for (let r = 0; r < 4; r++) pl(13.1 + i * 1.4 + r * .35, n, .15, .05); });
  // 21–26 happy bounce under lullaby
  for (let i = 0; i < 12; i++) { pl(21.1 + i * .4, [48, 55, 52, 55][i % 4], .3, .14, 'triangle'); noise(21.3 + i * .4, .05, { gain: .08, type: 'highpass', f0: 6000 }); }
  // 26–30 tiptoe + sting already
  [64, 0, 67, 0, 71, 72].forEach((n, i) => { if (n) pl(26.3 + i * .22, n, .18, .12, 'square'); });
  // ---- character "voices" (gibberish chirps on bubbles) ----
  const talk = (x, n, base, type, g) => { for (let i = 0; i < n; i++) tone(x + i * .11, base * (1 + rand(i + x * 10) * .5), .09, { type, gain: g, f1: base * (1.1 + rand(i + 3) * .3) }); };
  talk(6.25, 12, 150, 'square', .1);     // Кариес: «Сладкая ночка, ребята!»
  talk(9.75, 9, 650, 'triangle', .16);   // Зубик: «Э-э-это ещё кто?!»
  talk(19.75, 5, 500, 'triangle', .12);  // Зубик: «Только не я…»
  talk(22.7, 6, 170, 'square', .08);     // Кариес убегает
  const buf = await ac.startRendering();
  // encode WAV
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
  ws(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, 2, true); out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  ws(36, 'data'); out.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  let s = ''; const u8 = new Uint8Array(out.buffer); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(s);
}

window.renderAudio = renderAudio;
window.DURATION = DURATION;
window.renderFrame = render;
window.ready = document.fonts.load(F(900, 40)).then(() => document.fonts.load(F(800, 40)));
if (!/render=1/.test(location.search)) {
  let start = performance.now(), audio = null;
  window.ready.then(() => {
    const loop = now => { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
  cv.addEventListener('click', async () => {
    if (!audio) { audio = new Audio('data:audio/wav;base64,' + await renderAudio()); audio.loop = true; }
    audio.currentTime = 0; audio.play(); start = performance.now();
  });
}
</script>
